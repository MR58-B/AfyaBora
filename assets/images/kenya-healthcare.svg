<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="hcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#hcGrad)"/>
  <circle cx="660" cy="110" r="150" fill="#14b8a6" opacity="0.2"/>
  <!-- Stylized African Healthcare Clinician Illustration -->
  <g transform="translate(275, 65)">
    <!-- Coat / Shoulders -->
    <path d="M25,380 C25,295 75,265 125,265 C175,265 225,295 225,380 Z" fill="#ffffff"/>
    <path d="M95,265 L125,335 L155,265 Z" fill="#0f766e"/>
    <!-- Neck & Head (Rich Warm Brown Skin Tone) -->
    <rect x="107" y="215" width="36" height="55" rx="16" fill="#6d3b24"/>
    <ellipse cx="125" cy="165" rx="54" ry="64" fill="#7c4429"/>
    <!-- Hair -->
    <path d="M71,155 C68,95 182,95 179,155 C175,118 75,118 71,155 Z" fill="#1e1b18"/>
    <circle cx="125" cy="95" r="34" fill="#1e1b18"/>
    <!-- Friendly Smile & Eyes -->
    <circle cx="106" cy="162" r="5" fill="#1e1b18"/>
    <circle cx="144" cy="162" r="5" fill="#1e1b18"/>
    <path d="M107,188 Q125,204 143,188" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Stethoscope -->
    <path d="M88,270 C88,335 162,335 162,270" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="162" cy="315" r="11" fill="#dc2626" stroke="#ffffff" stroke-width="3"/>
    <!-- Red HIV Awareness Ribbon Pin -->
    <path d="M168,295 L178,275 L188,295" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  </g>
  <rect x="36" y="395" width="728" height="72" rx="12" fill="#0f172a" fill-opacity="0.72"/>
  <text x="400" y="427" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Confidential Care Across Kenyan Health Facilities</text>
  <text x="400" y="452" fill="#ccfbf1" font-family="sans-serif" font-size="14" text-anchor="middle">Free Testing • Counselling • TLD Antiretroviral Therapy • PrEP &amp; PEP</text>
</svg>